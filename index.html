<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFB6D9">
<title>PinkyEdu — Teman Praktikum & Tugas Kuliahmu ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --pink-50:#FFF5FA;
  --pink-100:#FFE8F3;
  --pink-200:#FFD1E6;
  --pink-300:#FFB6D9;
  --pink-400:#FF9CCB;
  --pink-500:#F47FB8;
  --pink-600:#E05FA0;
  --pink-700:#C24684;
  --pink-800:#9C3369;
  --cream:#FFF9F5;
  --white:#FFFFFF;
  --ink:#5A3A50;          /* warna teks utama - plum tua, bukan hitam */
  --ink-soft:#7A5A70;     /* teks sekunder - plum medium */
  --ink-mute:#A88AA0;     /* teks muted - plum muda */
  --line:#F5DDEB;
  --green:#4CAF7D;
  --red:#D64A6C;
  --shadow-sm:0 2px 8px rgba(244,127,184,.08);
  --shadow-md:0 6px 20px rgba(244,127,184,.12);
  --shadow-lg:0 12px 40px rgba(244,127,184,.18);
  --radius:20px;
  --radius-sm:14px;
  --radius-lg:28px;
  --nav-h:68px;
  --header-h:64px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  background:var(--pink-50);
  color:var(--ink);
  line-height:1.5;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + var(--safe-bottom));
}
h1,h2,h3,h4{font-family:'Quicksand',sans-serif;font-weight:700;line-height:1.25;color:var(--pink-700)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:var(--ink)}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink-mute);opacity:.85}
a{color:var(--pink-600);text-decoration:none}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--pink-200);border-radius:3px}

.app{max-width:640px;margin:0 auto;min-height:100vh;position:relative;background:var(--pink-50)}
@media(min-width:768px){.app{max-width:720px;box-shadow:0 0 60px rgba(244,127,184,.1)}}
.container{padding:0 16px}
.page{display:none;animation:pageIn .35s cubic-bezier(.4,0,.2,1)}
.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.header{
  position:sticky;top:0;z-index:40;
  background:rgba(255,245,250,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  height:var(--header-h);
}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:var(--header-h);gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--pink-300),var(--pink-500));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;box-shadow:var(--shadow-sm);
}
.brand-text{min-width:0}
.brand-name{font-family:'Quicksand';font-weight:700;font-size:17px;color:var(--pink-700);letter-spacing:-.3px}
.brand-tag{font-size:10px;color:var(--ink-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.header-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{
  width:40px;height:40px;border-radius:12px;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:var(--white);border:1px solid var(--line);
  transition:all .2s;font-size:18px;
}
.icon-btn:hover{background:var(--pink-100);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.94)}
.badge{
  position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;
  background:var(--pink-500);color:#fff;font-size:10px;font-weight:700;
  border-radius:9px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--pink-50);
}
.badge:empty,.badge[data-count="0"]{display:none}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-bottom);
  box-shadow:0 -4px 20px rgba(244,127,184,.08);
}
.bottom-nav-inner{
  display:flex;max-width:640px;margin:0 auto;
  height:var(--nav-h);align-items:center;justify-content:space-around;
}
@media(min-width:768px){.bottom-nav-inner{max-width:720px}}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;height:100%;color:var(--ink-mute);font-size:10.5px;font-weight:600;
  transition:color .2s;position:relative;padding:6px 2px;
}
.nav-item .nav-icon{font-size:20px;transition:transform .25s cubic-bezier(.34,1.56,.64,1);position:relative}
.nav-item.active{color:var(--pink-600)}
.nav-item.active .nav-icon{transform:translateY(-2px) scale(1.12)}
.nav-item.active::before{
  content:'';position:absolute;top:6px;width:28px;height:3px;border-radius:2px;
  background:var(--pink-500);animation:navPop .3s ease;
}
@keyframes navPop{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.nav-item:active .nav-icon{transform:scale(.9)}
.nav-badge{
  position:absolute;top:-2px;right:-8px;min-width:16px;height:16px;padding:0 4px;
  background:var(--pink-500);color:#fff;font-size:9px;font-weight:700;
  border-radius:8px;display:flex;align-items:center;justify-content:center;
}

.hero{
  margin:16px;border-radius:var(--radius-lg);padding:28px 22px;
  background:linear-gradient(135deg,#FFE8F3 0%,#FFF5FA 50%,#FFD1E6 100%);
  position:relative;overflow:hidden;box-shadow:var(--shadow-sm);
}
.hero::before,.hero::after{
  content:'';position:absolute;border-radius:50%;filter:blur(30px);opacity:.5;
}
.hero::before{width:160px;height:160px;background:var(--pink-300);top:-60px;right:-40px}
.hero::after{width:120px;height:120px;background:var(--pink-200);bottom:-40px;left:-30px}
.hero-content{position:relative;z-index:1}
.hero-badge{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  background:rgba(255,255,255,.7);font-size:11px;font-weight:700;color:var(--pink-700);
  margin-bottom:14px;border:1px solid rgba(255,255,255,.9);
}
.hero h1{font-size:26px;margin-bottom:10px;color:var(--pink-700);letter-spacing:-.5px}
.hero p{font-size:14px;color:var(--ink-soft);margin-bottom:20px;max-width:420px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 20px;border-radius:14px;font-weight:700;font-size:14px;
  transition:all .2s cubic-bezier(.4,0,.2,1);white-space:nowrap;
}
.btn:active{transform:scale(.96)}
.btn-primary{
  background:linear-gradient(135deg,var(--pink-400),var(--pink-500));
  color:#fff;box-shadow:0 4px 14px rgba(244,127,184,.35);
}
.btn-primary:hover{box-shadow:0 6px 20px rgba(244,127,184,.5);transform:translateY(-1px)}
.btn-secondary{
  background:var(--white);color:var(--pink-600);
  border:1.5px solid var(--pink-200);box-shadow:var(--shadow-sm);
}
.btn-secondary:hover{background:var(--pink-100);border-color:var(--pink-300)}
.btn-ghost{background:transparent;color:var(--ink-soft);padding:10px 14px}
.btn-ghost:hover{background:var(--pink-100);color:var(--pink-600)}
.btn-block{width:100%}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:11px}
.btn-lg{padding:15px 24px;font-size:15px;border-radius:16px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

.section{padding:24px 16px}
.section-title{font-size:19px;margin-bottom:4px;letter-spacing:-.3px;color:var(--pink-700)}
.section-sub{font-size:13px;color:var(--ink-mute);margin-bottom:16px}
.quote-card{
  margin:16px;padding:18px 20px;border-radius:var(--radius);
  background:linear-gradient(135deg,#FFF0F7,#FFE8F3);
  border-left:4px solid var(--pink-400);font-style:italic;
  font-size:14px;color:var(--pink-700);font-weight:600;
}

.highlight-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px}
.highlight-card{
  background:var(--white);border-radius:var(--radius-sm);padding:14px;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;gap:6px;transition:all .2s;
}
.highlight-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--pink-200)}
.highlight-card .hi-ic{font-size:22px}
.highlight-card h4{font-size:13px;font-weight:700;color:var(--pink-700)}
.highlight-card p{font-size:11px;color:var(--ink-mute);line-height:1.4}

.why-scroll{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 16px;scroll-snap-type:x mandatory;-ms-overflow-style:none;scrollbar-width:none}
.why-scroll::-webkit-scrollbar{display:none}
.why-card{
  min-width:170px;flex-shrink:0;scroll-snap-align:start;
  background:var(--white);border-radius:var(--radius);padding:16px;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);
}
.why-card .wi{font-size:26px;margin-bottom:8px}
.why-card h4{font-size:14px;margin-bottom:5px;color:var(--pink-700)}
.why-card p{font-size:12px;color:var(--ink-soft);line-height:1.45}

.product-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:520px){.product-grid{grid-template-columns:repeat(2,1fr)}}
.product-card{
  background:var(--white);border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);
  transition:all .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
}
.product-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--pink-200)}
.product-thumb{
  height:130px;position:relative;display:flex;align-items:center;justify-content:center;
  font-size:52px;background:linear-gradient(135deg,var(--pink-100),var(--pink-200));
  overflow:hidden;
}
.product-thumb::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.4),transparent 60%);
}
.product-badge{
  position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:999px;
  font-size:10px;font-weight:700;background:rgba(255,255,255,.92);color:var(--pink-700);
  backdrop-filter:blur(6px);
}
.product-badge.stock-low{background:#FFF0D9;color:#B5791E}
.product-badge.out{background:#FFE0E6;color:var(--red)}
.product-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.product-cat{font-size:10px;font-weight:700;color:var(--pink-500);text-transform:uppercase;letter-spacing:.5px}
.product-name{font-size:15px;font-weight:700;line-height:1.3;color:var(--pink-700)}
.product-desc{font-size:11.5px;color:var(--ink-mute);line-height:1.45;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-price{font-size:15px;font-weight:800;color:var(--pink-600)}
.product-price small{font-size:10.5px;color:var(--ink-mute);font-weight:500}
.product-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.product-actions .btn{font-size:11.5px;padding:9px 8px;border-radius:10px}
.product-actions .btn-full{grid-column:1/-1}

.search-bar{position:relative;margin-bottom:14px}
.search-bar input{
  width:100%;padding:13px 16px 13px 44px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--white);font-size:14px;
  transition:all .2s;box-shadow:var(--shadow-sm);color:var(--ink);
}
.search-bar input:focus{outline:none;border-color:var(--pink-400);box-shadow:0 0 0 4px rgba(255,182,217,.25)}
.search-bar .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--ink-mute)}
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;-ms-overflow-style:none;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.chip{
  padding:8px 16px;border-radius:999px;background:var(--white);border:1.5px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;
  transition:all .2s;flex-shrink:0;
}
.chip.active{background:linear-gradient(135deg,var(--pink-400),var(--pink-500));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(244,127,184,.3)}
.chip:hover:not(.active){border-color:var(--pink-300);color:var(--pink-600)}

.empty{
  text-align:center;padding:48px 24px;display:flex;flex-direction:column;
  align-items:center;gap:12px;
}
.empty .em-ic{font-size:56px;opacity:.85}
.empty h3{font-size:16px;color:var(--pink-700)}
.empty p{font-size:13px;color:var(--ink-mute);max-width:280px}

.cart-item{
  background:var(--white);border-radius:var(--radius-sm);padding:12px;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);
  display:flex;gap:12px;margin-bottom:10px;animation:pageIn .3s;
}
.cart-thumb{
  width:64px;height:64px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--pink-100),var(--pink-200));
  display:flex;align-items:center;justify-content:center;font-size:28px;
}
.cart-info{flex:1;min-width:0}
.cart-name{font-size:13.5px;font-weight:700;line-height:1.3;margin-bottom:2px;color:var(--pink-700)}
.cart-meta{font-size:11px;color:var(--ink-mute);margin-bottom:6px}
.cart-price{font-size:13px;font-weight:700;color:var(--pink-600)}
.qty-ctrl{display:inline-flex;align-items:center;gap:2px;background:var(--pink-50);border-radius:10px;padding:2px;border:1px solid var(--line)}
.qty-ctrl button{
  width:28px;height:28px;border-radius:8px;background:var(--white);color:var(--pink-600);
  font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;
  transition:all .15s;border:1px solid var(--line);
}
.qty-ctrl button:hover:not(:disabled){background:var(--pink-100)}
.qty-ctrl button:active:not(:disabled){transform:scale(.9)}
.qty-ctrl button:disabled{opacity:.4;cursor:not-allowed}
.qty-ctrl .qv{min-width:28px;text-align:center;font-weight:700;font-size:13px;color:var(--pink-700)}
.cart-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.del-btn{color:var(--red);font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:8px}
.del-btn:hover{background:#FFE8EE}

.cart-summary{
  background:var(--white);border-radius:var(--radius);padding:16px;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);margin-top:16px;
}
.summary-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;color:var(--ink-soft)}
.summary-row.total{
  font-size:16px;font-weight:800;color:var(--pink-700);
  border-top:1.5px dashed var(--line);margin-top:8px;padding-top:12px;
}
.note-input{
  width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--white);font-size:13px;resize:vertical;min-height:64px;
  transition:all .2s;margin-top:6px;color:var(--ink);
}
.note-input:focus{outline:none;border-color:var(--pink-400);box-shadow:0 0 0 4px rgba(255,182,217,.2)}
.label{font-size:12px;font-weight:700;color:var(--pink-700);margin-bottom:2px;display:block}

.form-group{margin-bottom:14px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--white);font-size:14px;transition:all .2s;color:var(--ink);
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  outline:none;border-color:var(--pink-400);box-shadow:0 0 0 4px rgba(255,182,217,.2);
}
.form-group input.error,.form-group select.error,.form-group textarea.error{border-color:var(--red);box-shadow:0 0 0 4px rgba(229,97,124,.15)}
.err-msg{font-size:11px;color:var(--red);margin-top:4px;display:none;font-weight:600}
.err-msg.show{display:block;animation:pageIn .2s}
.helper{font-size:11px;color:var(--pink-600);margin-top:4px;font-weight:600}

.time-info{
  background:linear-gradient(135deg,#FFF0F7,#FFE8F3);
  border:1px dashed var(--pink-300);border-radius:12px;
  padding:12px 14px;margin-bottom:14px;font-size:12px;color:var(--pink-700);
  font-weight:600;display:flex;gap:8px;align-items:flex-start;
}
.time-info .tic{font-size:16px;flex-shrink:0}
.quick-time{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick-time button{
  padding:6px 12px;border-radius:999px;background:var(--white);
  border:1.5px solid var(--pink-200);font-size:11.5px;font-weight:700;
  color:var(--pink-600);transition:all .2s;
}
.quick-time button:hover{background:var(--pink-100);border-color:var(--pink-400)}
.quick-time button:active{transform:scale(.95)}

.pay-options{display:flex;flex-direction:column;gap:8px}
.pay-opt{
  display:flex;align-items:center;gap:12px;padding:14px;
  border-radius:12px;border:1.5px solid var(--line);background:var(--white);
  cursor:pointer;transition:all .2s;
}
.pay-opt:hover{border-color:var(--pink-300);background:var(--pink-50)}
.pay-opt.selected{border-color:var(--pink-500);background:var(--pink-100);box-shadow:0 0 0 3px rgba(255,182,217,.3)}
.pay-radio{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--pink-300);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.pay-opt.selected .pay-radio{border-color:var(--pink-500)}
.pay-opt.selected .pay-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--pink-500)}
.pay-label{font-size:13.5px;font-weight:600;flex:1;color:var(--pink-700)}
.pay-desc{font-size:11px;color:var(--ink-mute)}

.upload-area{
  border:2px dashed var(--pink-300);border-radius:14px;padding:20px;
  text-align:center;background:var(--pink-50);cursor:pointer;transition:all .2s;
}
.upload-area:hover{background:var(--pink-100);border-color:var(--pink-400)}
.upload-area .ui{font-size:28px;margin-bottom:6px}
.upload-area p{font-size:12.5px;color:var(--pink-700);font-weight:600}
.upload-area small{font-size:11px;color:var(--ink-mute)}
.file-pill{
  display:inline-flex;align-items:center;gap:8px;padding:8px 12px;
  background:var(--pink-100);border-radius:10px;font-size:12px;font-weight:600;
  color:var(--pink-700);margin-top:10px;
}
.file-pill button{color:var(--red);font-weight:700;font-size:14px}

.modal-overlay{
  position:fixed;inset:0;z-index:100;background:rgba(90,58,80,.5);
  backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;
  animation:fadeIn .25s;
}
.modal-overlay.active{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--white);border-radius:24px 24px 0 0;width:100%;max-width:640px;
  max-height:92vh;overflow-y:auto;animation:slideUp .35s cubic-bezier(.4,0,.2,1);
  padding:22px 18px calc(22px + var(--safe-bottom));
}
@media(min-width:768px){.modal{max-width:720px;border-radius:24px;margin:auto}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-header h3{font-size:18px;color:var(--pink-700)}
.modal-close{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-mute);background:var(--pink-50)}
.modal-close:hover{background:var(--pink-100);color:var(--pink-600)}
.confirm-box{
  background:var(--pink-50);border-radius:14px;padding:14px;margin-bottom:14px;
  border:1px dashed var(--pink-200);
}
.confirm-row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:4px 0}
.confirm-row .k{color:var(--ink-mute);font-weight:600}
